aid: simbe-robotics
name: Simbe Robotics
description: Simbe Robotics (Simbe) is a San Francisco Bay Area physical-AI and retail-robotics company
  whose Store Intelligence platform combines the Tally shelf-scanning robot, fixed in-store sensors and
  RFID to give grocery, wholesale-club, home-improvement and specialty retailers real-time inventory,
  pricing and shelf-condition data. Tally is built on ROS and feeds Simbe's cloud platform, which exposes
  store data to retailers through a front-end application, a mobile app and virtual store tours, and through
  an API that pushes shelf, out-of-stock and price-accuracy data into a retailer's existing merchandising,
  inventory and task-management systems. Deployments include BJ's Wholesale Club, Schnuck Markets, Wakefern/ShopRite,
  SpartanNash, Ball's Foods, Kaufland, Decathlon and Theisen's. Simbe operates a public status page that
  monitors a Website, an App and an API component, and a Vanta-hosted trust center, but publishes no public
  developer portal, API reference or machine-readable specification — its FAQ states that "standard API
  documentation" is supplied to customers as part of an integration engagement.
